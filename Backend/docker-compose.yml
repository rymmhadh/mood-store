# Base de données de développement.
#
#   docker compose up -d                        démarre PostgreSQL
#   docker compose --profile inspection up -d   + Adminer, pour regarder la base
#   docker compose ps                           état des services
#   docker compose down                         arrête, en gardant les données
#   docker compose down -v                      arrête ET efface le volume
#
# Le volume nommé `moodstore-donnees` survit aux redémarrages : les pièces
# ajoutées depuis le back-office ne disparaissent pas quand on éteint le poste.

services:
  base:
    image: postgres:16-alpine
    container_name: moodstore-base
    restart: unless-stopped
    environment:
      POSTGRES_USER: moodstore
      POSTGRES_PASSWORD: moodstore
      POSTGRES_DB: moodstore
      # Tri et comparaison de chaînes corrects en français (« é » entre « e » et « f »).
      LANG: fr_FR.utf8
    ports:
      - '5433:5432'
    volumes:
      - moodstore-donnees:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U moodstore -d moodstore']
      interval: 5s
      timeout: 5s
      retries: 10

  # Interface web pour regarder la base sans installer de client.
  # http://localhost:8081 — serveur « base », utilisateur et mot de passe « moodstore ».
  #
  # Placé derrière un profil : `docker compose up -d` ne démarre que la base.
  # Sans cela, une image Adminer qui refuse de se télécharger — registre
  # inaccessible, réseau filtré — fait échouer toute la commande, PostgreSQL
  # compris. Un confort d'inspection ne doit jamais empêcher le projet de
  # démarrer.
  #
  # Pour l'obtenir quand on en a besoin :
  #     docker compose --profile inspection up -d
  adminer:
    image: adminer:5
    container_name: moodstore-adminer
    profiles: ['inspection']
    restart: unless-stopped
    ports:
      - '8081:8080'
    depends_on:
      base:
        condition: service_healthy

volumes:
  moodstore-donnees:
